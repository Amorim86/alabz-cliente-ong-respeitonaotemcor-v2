name: Protect Legacy ONG System Routes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-legacy-routes:
    name: Validate Immutable Legacy Routes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Legacy System Routing Validation
        run: npm run validate:legacy-system
